name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - name: spec-ctx check
        run: npx -y spec-ctx@0.6.0 check --strict
      - name: OpenSpec validate
        run: npx -y @fission-ai/openspec@2.1.0 validate --all --strict --no-interactive
      - name: Electron tests of the frozen extension (does not block)
        continue-on-error: true
        run: xvfb-run -a npm test
